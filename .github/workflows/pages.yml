name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Install dependencies
        run: npm ci

      # The engine is rebuilt only when its sources change. Reusing the same bytes keeps its content hash
      # (vendor/mysql/engine.json) the same, so visitors' browsers keep the copy they already downloaded.
      - name: Restore the MySQL engine built from the same sources
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: |
            engine/dist/mysql.wasm
            engine/dist/wasm_exec.js
          key: engine-${{ hashFiles('engine/main.go', 'engine/go.mod', 'engine/go.sum', 'engine/build.sh', 'engine/patches/**') }}

      - name: Build the MySQL engine (go-mysql-server → WebAssembly)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: npm run engine

      - name: Run tests (exercise solutions on MySQL, site structure)
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
